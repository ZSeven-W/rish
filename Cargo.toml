[workspace]
members = [
  "crates/rish-applets",
  "crates/rish-cli",
  "crates/rish-content",
  "crates/rish-core",
  "crates/rish-ffi",
  "crates/rish-guest-agent",
  "crates/rish-guest-boot",
  "crates/rish-guest-importer",
  "crates/rish-guest-protocol",
  "crates/rish-layer",
  "crates/rish-oci",
  "crates/rish-pull",
  "crates/rish-registry",
  "crates/rish-runtime",
  "crates/rish-snapshot",
  "crates/rish-softvm-core",
  "crates/rish-softvm-x86_64",
  "crates/rish-vm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ZSeven-W/rish"

[workspace.dependencies]
rish-applets = { path = "crates/rish-applets" }
rish-content = { path = "crates/rish-content" }
rish-core = { path = "crates/rish-core" }
rish-guest-agent = { path = "crates/rish-guest-agent" }
rish-guest-boot = { path = "crates/rish-guest-boot" }
rish-guest-importer = { path = "crates/rish-guest-importer" }
rish-guest-protocol = { path = "crates/rish-guest-protocol" }
rish-layer = { path = "crates/rish-layer" }
rish-oci = { path = "crates/rish-oci" }
rish-pull = { path = "crates/rish-pull" }
rish-registry = { path = "crates/rish-registry" }
rish-runtime = { path = "crates/rish-runtime" }
rish-snapshot = { path = "crates/rish-snapshot" }
rish-softvm-core = { path = "crates/rish-softvm-core" }
rish-softvm-x86_64 = { path = "crates/rish-softvm-x86_64" }
rish-vm = { path = "crates/rish-vm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# Release tuning for the interpreter's hot loop: full LTO and a single codegen
# unit let the fetch/dispatch/translate/memory chain inline across crate
# boundaries, and target-cpu=native (via .cargo/config) uses the host's vector
# units. All are codegen-only — no behavior change.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
