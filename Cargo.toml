[workspace]
members = [
  "crates/rish-cli",
  "crates/rish-core",
  "crates/rish-ffi",
  "crates/rish-oci",
  "crates/rish-runtime",
  "crates/rish-vm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ZSeven-W/rish"

[workspace.dependencies]
rish-core = { path = "crates/rish-core" }
rish-oci = { path = "crates/rish-oci" }
rish-runtime = { path = "crates/rish-runtime" }
rish-vm = { path = "crates/rish-vm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
