[package]
name = "rish-snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Transactional userspace OCI rootfs snapshot materializer for rish"

[dependencies]
rish-content.workspace = true
rish-layer.workspace = true
rish-registry.workspace = true
tempfile = "3.20"
thiserror.workspace = true

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
