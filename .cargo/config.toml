# Host-only tuning: target-cpu=native uses the developer machine's vector units
# for the desktop interpreter. Scoped to the host triple so iOS/Android cross
# builds keep their portable target baseline.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

# The x86_64 guest agent is cross-compiled to musl for the interpreter's Linux
# guest. On macOS the default linker cannot emit ELF, so route this target
# through the musl-cross toolchain (brew install FiloSottile/musl-cross/musl-cross).
[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"
